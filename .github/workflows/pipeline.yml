name: Weekly Strava Pipeline

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs: 
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        uses: pip install -r requirements.txt

      - name: Create.env file
        run: |
          echo "STRAVA_CLIENT_ID"=${{ secrets.STRAVA_CLIENT_ID }}" >> .env
          echo "STRAVA_CLIENT_SECRET=${{ secrets.STRAVA_CLIENT_SECRET }}" >> .env
          echo "STRAVA_REDIRECT_URI=${{ secrets.STRAVA_REDIRECT_URI }}" >> .env
          echo "STRAVA_ACCESS_TOKEN=${{ secrets.STRAVA_ACCESS_TOKEN }}" >> .env
          echo "STRAVA_REFRESH_TOKEN=${{ secrets.STRAVA_REFRESH_TOKEN }}" >> .env
          echo "STRAVA_TOKEN_EXPIRES_AT=${{ secrets.STRAVA_TOKEN_EXPIRES_AT }}" >> .env
          echo "AZURE_STORAGE_CONNECTION_STRING=${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" >> .env
        
      - name: Run pipeline
        run: python pipeline.py